      const c = document.getElementById('master-close-confirm');
      if (c) c.style.display = 'none';
      masterModalSnapshot = null;
    }
    // ✖ボタン：変更があれば「保存しますか？」と聞く
    function closeMasterModal() {
      if (!masterModalDirty) { hideMasterModal(); return; }
      document.getElementById('master-close-confirm').style.display = 'flex';
    }
    function answerMasterClose(save) {
      document.getElementById('master-close-confirm').style.display = 'none';
      if (save) {
        saveMasterData();
      } else {
        if (masterModalSnapshot) currentMasters = masterModalSnapshot;
        masterModalDirty = false;
        initMasterSelects();
        hideMasterModal();
        showToast('変更を保存せずに閉じました');
      }
    }
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTab();
    }

    function toggleDisplayNameCol() {
      showDisplayNameCol = !showDisplayNameCol;
      const btn = document.getElementById('btn-toggle-displayname');
      if (btn) btn.textContent = showDisplayNameCol ? '🔽 プルダウンの略称を隠す' : '🔽 プルダウンの略称を編集';
      if (showDisplayNameCol) {
        showToast('🔽 プルダウン選択時に出る名前です。会社名を入力すると自動で入ります');
      }
      renderTab();
    }

    const TABS_WITHOUT_DISPLAYNAME_TOGGLE = ['persons', 'depts', 'surnames'];

    function renderTab() {
      const container = document.getElementById('tab-container');
      const items = currentMasters[activeTab];

      const toggleBtn = document.getElementById('btn-toggle-displayname');
      if (toggleBtn) {
        const relevant = !TABS_WITHOUT_DISPLAYNAME_TOGGLE.includes(activeTab);
        toggleBtn.style.display = relevant ? '' : 'none';
      }

      let html = `<table class="master-table"><thead><tr>`;
      if (activeTab === 'persons') {
        html += `<th>氏名</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td><input class="col-wide" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)"></td>
            <td><button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button></td>
          </tr>`;
        });
      } else if (activeTab === 'depts') {
        html += `<th>所属部署</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td><input class="col-wide" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)"></td>
            <td><button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button></td>
          </tr>`;
        });
      } else if (activeTab === 'sites') {
        html += `<th class="col-displayname">表示名</th><th>正式現場名(事業場名)</th><th>郵便番号</th><th>所在地</th><th>電話番号</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td class="col-displayname"><input class="col-medium" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)" onpaste="handleMasterNamePaste(event, ${i})"></td>
            <td><textarea class="col-wide master-multiline" rows="2" wrap="off" title="改行したい位置でEnterを押すと、用紙でも同じ位置で2行に分かれます" onchange="updateMasterItem(${i}, 'siteName', limitToMaxLines(this.value))">${escapeHtmlText(item.siteName || '')}</textarea></td>
            <td><input class="col-narrow" type="text" value="${item.zip || ''}" onchange="updateMasterItem(${i}, 'zip', this.value)" onblur="handleMasterZipBlur(${i})"></td>
            <td><input class="col-wide" type="text" value="${item.addr || ''}" onchange="updateMasterItem(${i}, 'addr', this.value)"></td>
            <td><input class="col-narrow" type="text" value="${item.tel || ''}" onchange="updateMasterItem(${i}, 'tel', this.value)"></td>
            <td style="white-space:nowrap;">
              <button class="btn btn-dark" style="padding:2px 6px;" title="コピー（表計算に貼り付けると自動で列分けされます）" onclick="copyMasterItem(${i})">📋</button>
              <button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button>
            </td>
          </tr>`;
        });
      } else if (activeTab === 'surnames') {
        html += `<th>運搬者・サイン用</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td><input class="col-wide" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)"></td>
            <td><button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button></td>
          </tr>`;
        });
      } else if (activeTab === 'vehicles' || activeTab === 'vehicles2') {
        html += `<th class="col-displayname">表示名</th><th>車種</th><th>車両番号</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td class="col-displayname"><input class="col-wide" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)"></td>
            <td><input class="col-medium" type="text" value="${item.type || ''}" onchange="updateMasterItem(${i}, 'type', this.value)"></td>
            <td><input class="col-medium" type="text" value="${item.no || ''}" onchange="updateMasterItem(${i}, 'no', this.value)"></td>
            <td><button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button></td>
          </tr>`;
        });
      } else {
        const compHeaderLabel = (activeTab === 'disposals' || activeTab === 'tsSites') ? '会社名または施設名' : '会社名';
        html += `<th class="col-displayname">表示名</th><th>${compHeaderLabel}</th><th>郵便番号</th><th>住所</th><th>電話番号</th><th>操作</th></tr></thead><tbody>`;
        items.forEach((item, i) => {
          html += `<tr>
            <td class="col-displayname"><input class="col-medium" type="text" value="${item.name || ''}" onchange="updateMasterItem(${i}, 'name', this.value)" onpaste="handleMasterNamePaste(event, ${i})"></td>
            <td><input class="col-wide" type="text" value="${item.compName || ''}" onchange="updateMasterItem(${i}, 'compName', this.value)"></td>
            <td><input class="col-narrow" type="text" value="${item.zip || ''}" onchange="updateMasterItem(${i}, 'zip', this.value)" onblur="handleMasterZipBlur(${i})"></td>
            <td><input class="col-wide" type="text" value="${item.addr || ''}" onchange="updateMasterItem(${i}, 'addr', this.value)"></td>
            <td><input class="col-narrow" type="text" value="${item.tel || ''}" onchange="updateMasterItem(${i}, 'tel', this.value)"></td>
            <td style="white-space:nowrap;">
              <button class="btn btn-dark" style="padding:2px 6px;" title="コピー（表計算に貼り付けると自動で列分けされます）" onclick="copyMasterItem(${i})">📋</button>
              <button class="btn btn-red" style="padding:2px 6px;" title="削除" onclick="deleteMasterRow(${i})">🗑️</button>
            </td>
          </tr>`;
        });
      }
      html += `</tbody></table>`;
      container.innerHTML = html;
      container.classList.toggle('hide-displayname-col', !showDisplayNameCol);
    }

    // 正式名称から、プルダウン表示用の短い名称を自動生成する（会社形態の略称化＋末尾のよくある施設名の省略）
    // 以前の短縮ルール（自動で付けた略称かどうかの判定にだけ使う）
    function legacyShortenCompanyName(compName) {
      if (!compName) return '';
      let s = compName.replace(/株式会社/g, '(株)').replace(/有限会社/g, '(有)').replace(/合同会社/g, '(合)');
      const trailingSuffixes = ['木くず・がれき類破砕施設', '木くず･がれき類破砕施設', '破砕施設', '処分場', '事業所', '工場', '施設'];
      for (const suf of trailingSuffixes) {
        if (s.endsWith(suf)) {
          s = s.slice(0, s.length - suf.length).replace(/[\s　]+$/, '');
          break;
        }
      }
      return s.trim();
    }

    // カタカナを半角カタカナにする（濁点・半濁点も対応）
    const HALF_KANA_MAP = (() => {
      const full = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォッャュョー・';
      const half = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝｧｨｩｪｫｯｬｭｮｰ･';
      const m = {};
      for (let i = 0; i < full.length; i++) m[full[i]] = half[i];
      return m;
    })();
    function toHalfWidthKana(s) {
      return (s || '').replace(/[\u30A1-\u30F4\u30FB\u30FC]/g, ch => {
        if (ch === 'ヴ') return 'ｳﾞ';
        const d = ch.normalize('NFD');
        const base = HALF_KANA_MAP[d[0]];
        if (!base) return ch;
        if (d[1] === '\u3099') return base + 'ﾞ';
        if (d[1] === '\u309A') return base + 'ﾟ';
        return base;
      });
    }

    // プルダウン用の略称を、できるだけ短く自動で作る
    function autoShortenCompanyName(compName) {
      if (!compName) return '';
      let s = String(compName).replace(/[\r\n]+/g, '');
      s = s.replace(/株式会社/g, '(株)').replace(/有限会社/g, '(有)').replace(/合同会社/g, '(合)')
           .replace(/合資会社/g, '(資)').replace(/合名会社/g, '(名)')
           .replace(/一般社団法人/g, '(一社)').replace(/一般財団法人/g, '(一財)');
      s = s.replace(/（/g, '(').replace(/）/g, ')');
      const trailingSuffixes = ['木くず・がれき類破砕施設', '木くず･がれき類破砕施設', '破砕施設', '処分場', '事業所', '工場', '施設'];
      for (const suf of trailingSuffixes) {
        if (s.endsWith(suf)) {
          s = s.slice(0, s.length - suf.length).replace(/[\s　]+$/, '');
          break;
        }
      }
      s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      s = toHalfWidthKana(s);
      s = s.replace(/[\s　]+/g, ' ').trim();
      return s;
    }

    // 略称が「自動で付けたもの（または空）」なら、正式名称の変更に合わせて付け直す。手で変えた略称は守る
    function displayNameFollowsSource(item, sourceField, oldSource) {
      const name = (item.name || '').trim();
      if (name === '') return true;
      if (sourceField === 'siteName') return name === normalizeLineBreaks(oldSource || '');
      return name === autoShortenCompanyName(oldSource) || name === legacyShortenCompanyName(oldSource) || name === (oldSource || '');
    }

    async function handleMasterZipBlur(idx) {
      const item = currentMasters[activeTab][idx];
      if (!item || !('addr' in item) || (item.addr && item.addr.trim() !== '')) return;
      const addr = await lookupZipAddress(item.zip);
      if (addr) {
        item.addr = addr;
        masterModalDirty = true;
        renderTab();
        showToast('📮 郵便番号から住所を自動入力しました（続きをご入力ください）');
      }
    }

    function updateMasterItem(idx, key, val) {
      if (key === 'name' && val.indexOf('\t') !== -1) {
        distributeMasterRowPaste(idx, val);
        return;
      }
      const oldSource = currentMasters[activeTab][idx][key];
      currentMasters[activeTab][idx][key] = val;
      masterModalDirty = true;
      if (key === 'compName' || key === 'siteName') {
        const item = currentMasters[activeTab][idx];
        if (displayNameFollowsSource(item, key, oldSource)) {
          const next = key === 'siteName' ? normalizeLineBreaks(val) : autoShortenCompanyName(val);
          if (item.name !== next) {
            item.name = next;
            renderTab();
          }
        }
      }
      if ((key === 'type' || key === 'no') && (activeTab === 'vehicles' || activeTab === 'vehicles2')) {
        const item = currentMasters[activeTab][idx];
        if (!item.name || item.name.trim() === '') {
          if (item.type && item.no) {
            item.name = `${item.type} (${item.no})`;
            renderTab();
          }
        }
      }
    }

    function handleMasterNamePaste(e, idx) {
      const clip = e.clipboardData || window.clipboardData;
      const text = clip ? clip.getData('text') : '';
      if (!text || text.indexOf('\t') === -1) return; // タブ区切りでなければ通常の貼り付けに任せる
      e.preventDefault();
      distributeMasterRowPaste(idx, text);
    }

    function distributeMasterRowPaste(idx, text) {
      const item = currentMasters[activeTab][idx];
      if (!item) return;
      const parts = text.split('\t').map(tsvUnquote); // [表示名, 会社名/現場名, 郵便番号, 住所, 電話番号]
      item.name = parts[0] || item.name;
      if ('siteName' in item) item.siteName = parts[1] || item.siteName;
      else item.compName = parts[1] || item.compName;
      if ('zip' in item) item.zip = parts[2] || item.zip;
      if ('addr' in item) item.addr = parts[3] || item.addr;
      if ('tel' in item) item.tel = parts[4] || item.tel;
      masterModalDirty = true;
      renderTab();
      showToast('📋 貼り付けた内容を全項目へ振り分けました');
    }

    function addMasterRow() {
      if (activeTab === 'persons' || activeTab === 'depts' || activeTab === 'surnames') currentMasters[activeTab].push({ name: "" });
      else if (activeTab === 'sites') currentMasters.sites.push({ name: "", siteName: "", zip: "", addr: "", tel: "" });
      else if (activeTab === 'vehicles' || activeTab === 'vehicles2') currentMasters[activeTab].push({ name: "", type: "", no: "" });
      else currentMasters[activeTab].push({ name: "", compName: "", zip: "", addr: "", tel: "" });
      masterModalDirty = true;
      renderTab();
      setTimeout(() => {
        const rows = document.querySelectorAll('#tab-container tbody tr');
        const lastRow = rows[rows.length - 1];
        if (!lastRow) return;
        // 会社名（正式名称）欄があればそこへ、なければ最初の入力欄へフォーカスする
        const target = lastRow.querySelector('.col-wide') || lastRow.querySelector('input');
        if (target) target.focus();
      }, 0);
    }
    function doCopyText(text) {
      if (!text) return;
      const fallbackCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('📋 コピーしました'); }
        catch (e) { alert('コピーに失敗しました。以下の内容を手動でコピーしてください：\n\n' + text); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('📋 コピーしました（表計算に貼り付けると自動で列分けされます）')).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function copyMasterItem(idx) {
      const item = currentMasters[activeTab][idx];
      if (!item) return;
      const compOrSite = item.compName || item.siteName || '';
      const text = [item.name || '', compOrSite, item.zip || '', item.addr || '', item.tel || ''].map(tsvQuote).join('\t');
      doCopyText(text);
    }

    function deleteMasterRow(idx) {
      const item = currentMasters[activeTab][idx];
      const label = item ? (item.name || item.compName || 'この項目') : 'この項目';
      if (!confirm(`「${label}」を削除します。この操作は元に戻せません。よろしいですか？`)) return;
      currentMasters[activeTab].splice(idx, 1);
      masterModalDirty = true;
      renderTab();
    }

    function exportMasterData() {
      const text = JSON.stringify(currentMasters, null, 2);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ マスターデータ全体（排出者・事業場・運搬業者・車両・処分先など全カテゴリ）をクリップボードにコピーしました。\n\nそのままClaudeに貼り付けてください。');
        }).catch(() => {
          window.prompt('コピーに失敗しました。以下を手動で全選択してコピーしてください（Ctrl+A → Ctrl+C）：', text);
        });
      } else {
        window.prompt('この内容を全部（Ctrl+Aで全選択してから）コピーしてClaudeに貼り付けてください：', text);
      }
    }

    function saveMasterData() {
      Object.keys(currentMasters).forEach(key => {
        if (key === 'vehicles' || key === 'vehicles2') {
          currentMasters[key].sort((a, b) => (a.type || '').localeCompare(b.type || '', 'ja') || (a.no || '').localeCompare(b.no || '', 'ja'));
        } else if (key === 'transporters') {
          currentMasters[key].sort((a, b) => {
            const aIsTsutsuga = (a.name || '').includes('筒賀建設');
            const bIsTsutsuga = (b.name || '').includes('筒賀建設');
            if (aIsTsutsuga && !bIsTsutsuga) return -1;
            if (bIsTsutsuga && !aIsTsutsuga) return 1;
            return japaneseNameCompare(a.name, b.name);
          });
        } else {
          currentMasters[key].sort((a, b) => japaneseNameCompare(a.name, b.name));
        }
      });
      localStorage.setItem('manifest_masters', JSON.stringify(currentMasters));
      initMasterSelects();
      masterModalDirty = false;
      hideMasterModal();
      pushMasterToCloud();
      showToast('✅ マスターデータを保存し整列しました！');
    }
  </script>
</body>
